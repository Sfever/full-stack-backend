name: Main checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: backend-main-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-checks:
    name: Backend strict checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Require dev as the pull request source
        if: github.event_name == 'pull_request' && (github.head_ref != 'dev' || github.event.pull_request.head.repo.full_name != github.repository)
        run: |
          echo "::error::Pull requests into main must come from this repository's dev branch."
          exit 1

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
