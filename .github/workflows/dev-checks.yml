name: Dev checks

on:
  pull_request:
    branches: [dev]

concurrency:
  group: backend-dev-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-checks:
    name: Backend strict checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/video_forge_test
      SESSION_SECRET: ci-only-session-secret-with-at-least-32-bytes

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: video_forge_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d video_forge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build production container targets
        run: |
          docker build --target runtime --tag video-forge-backend:ci .
          docker build --target migrations --tag video-forge-migrations:ci .

      - name: Apply migrations to a fresh PostgreSQL database
        run: npm run migrate:ci

      - name: Smoke-test health and database readiness
        shell: bash
        run: |
          npm start >"$RUNNER_TEMP/backend.log" 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/api/ready; then
              exit 0
            fi

            if ! kill -0 "$backend_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/backend.log"
              exit 1
            fi

            sleep 1
          done

          cat "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
